<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Work Time Tracker</title>
  <link rel="stylesheet" href="tmstyles.css"/>
</head>
<body>
  <div class="container">
    <h1>Work Time Tracker</h1>
    <button onclick="toggleForm()">Add Entry</button>
    <div id="form-container" class="hidden">
      <form id="entryForm">
        <input type="date" name="date" required />
        <input type="text" name="signer" placeholder="Signer Name" required />
        <input type="time" name="start" required />
        <input type="time" name="end" required />
        <input type="number" step="0.01" name="hours" placeholder="Total Hours" required />
        <button type="submit">Submit</button>
      </form>
    </div>
    <div id="calendar"></div>
    <div id="weekly-summary"></div>
  </div>
  <script src="tmscript.js"></script>
</body>
</html>
