<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Entry</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #f5f5f5;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, button {
      display: block;
      width: 100%;
      margin-bottom: 15px;
      padding: 10px;
      font-size: 16px;
    }
    button {
      background-color: #4285F4;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #3367D6;
    }
  </style>
</head>
<body>

  <form id="entryForm">
    <h2>Add New Entry</h2>
    <input type="date" name="date" required value="<?= new Date().toISOString().split('T')[0] ?>">
    <input type="text" name="name" placeholder="Signer Name" required>
    <input type="time" name="startTime" placeholder="Start Time" required>
    <input type="time" name="endTime" placeholder="End Time" required>
    <button type="submit">Add Entry</button>
  </form>

  <script>
    document.getElementById('entryForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);

      try {
        const response = await fetch('https://script.google.com/macros/s/AKfycbwRI0wW7EnW-FOAY8HlSHRhWkJ8uJFVH8xhy3VGvD-vL1ApC1apdOUE2EiG5lLzv7fj/exec', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();
        if (result.result === 'success') {
          alert('Entry added successfully!');
          form.reset();
        } else {
          alert('Error: ' + result.error);
        }
      } catch (err) {
        alert('Fetch failed: ' + err.message);
      }
    });
  </script>

</body>
</html>
