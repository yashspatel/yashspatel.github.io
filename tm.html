<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Calendar Notes</title>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js"></script>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }
    #calendar {
      max-width: 900px;
      margin: 40px auto;
    }
    .form-popup {
      display: none;
      position: fixed;
      top: 20%;
      left: 35%;
      background: #fff;
      border: 1px solid #ccc;
      padding: 20px;
      z-index: 999;
    }
  </style>
</head>
<body>
  <h2>Google Sheet Calendar</h2>
  <button onclick="openForm()">Add Entry</button>

  <div id="calendar"></div>

  <div class="form-popup" id="entryForm">
    <h3>New Entry</h3>
    <label>Signer Name: <input type="text" id="signer"></label><br><br>
    <label>Start Time: <input type="time" id="startTime"></label><br><br>
    <label>End Time: <input type="time" id="endTime"></label><br><br>
    <button onclick="saveEntry()">Save</button>
    <button onclick="closeForm()">Cancel</button>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxGitH2IHycB25KgZ7nlErf8fbET_fb-twsYsiJvmeuZNTQdaYeG_o97FrkwUVJAVt0/exec';

    const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
      initialView: 'dayGridMonth',
      selectable: true,
      dateClick: function(info) {
        selectedDate = info.dateStr;
        openForm();
      },
      events: scriptURL
    });

    let selectedDate = new Date().toISOString().split('T')[0];
    calendar.render();

    function openForm() {
      document.getElementById("entryForm").style.display = "block";
    }

    function closeForm() {
      document.getElementById("entryForm").style.display = "none";
    }

    function saveEntry() {
      const signer = document.getElementById("signer").value;
      const startTime = document.getElementById("startTime").value;
      const endTime = document.getElementById("endTime").value;

      if (!signer || !startTime || !endTime) {
        alert("Fill all fields");
        return;
      }

      fetch(scriptURL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          date: selectedDate,
          signer,
          startTime,
          endTime
        })
      }).then(res => res.json())
        .then(() => {
          calendar.refetchEvents();
          closeForm();
        })
        .catch(console.error);
    }
  </script>
</body>
</html>
