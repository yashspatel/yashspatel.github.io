<!DOCTYPE html>
<html>
<head>
  <title>Add Entry to Google Sheet</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }
    input {
      margin: 5px;
      padding: 5px;
    }
    button {
      padding: 8px 16px;
    }
  </style>
</head>
<body>
  <h2>Add New Entry</h2>

  <label>Date: <input type="date" id="date" required></label><br>
  <label>Signer Name: <input type="text" id="signer" required></label><br>
  <label>Start Time: <input type="time" id="startTime" required></label><br>
  <label>End Time: <input type="time" id="endTime" required></label><br>
  <button onclick="submitEntry()">Submit</button>

  <p id="status"></p>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzZjQqUkyJZdPZ99gHSalJMFiO1BdTSM9v300SUIlTMMFLgPtDMHVuydLnh_AJmOC_8/exec';

    function submitEntry() {
      const date = document.getElementById("date").value;
      const signer = document.getElementById("signer").value;
      const startTime = document.getElementById("startTime").value;
      const endTime = document.getElementById("endTime").value;

      if (!date || !signer || !startTime || !endTime) {
        alert("Please fill in all fields.");
        return;
      }

      fetch(scriptURL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date, signer, startTime, endTime })
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById("status").innerText = "Entry added successfully!";
      })
      .catch(error => {
        console.error('Error!', error.message);
        document.getElementById("status").innerText = "Error adding entry.";
      });
    }
  </script>
</body>
</html>
