<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Work Calendar</title>
  <link rel="stylesheet" href="tmstyles.css">
</head>
<body>
  <h1>Weekly Work Calendar</h1>
  <div class="calendar-wrapper" id="calendarWrapper"></div>

  <button class="add-button" onclick="document.getElementById('entryModal').classList.add('show')">+ Add Entry</button>

  <div id="entryModal">
    <h3>Add Entry</h3>
    <input type="text" id="signer" placeholder="Signer Name" />
    <input type="time" id="start" />
    <input type="time" id="end" />
    <button onclick="submitEntry()">Save</button>
    <button onclick="document.getElementById('entryModal').classList.remove('show')">Cancel</button>
  </div>

  <script src="tmscript.js"></script>
</body>
</html>
