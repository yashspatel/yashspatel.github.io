<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calendar with Notes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet" />
</head>
<body class="p-4">

  <h2 class="mb-3">Work Calendar</h2>
  <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#noteModal">Add Entry</button>
  <div id="calendar"></div>

  <!-- Modal -->
  <div class="modal fade" id="noteModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="entryForm">
          <div class="modal-header">
            <h5 class="modal-title">Add Work Entry</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <label>Date:</label>
            <input type="date" id="date" class="form-control" required />
            <label>Signer Name:</label>
            <input type="text" id="signer" class="form-control" required />
            <label>Start Time:</label>
            <input type="time" id="startTime" class="form-control" required />
            <label>End Time:</label>
            <input type="time" id="endTime" class="form-control" required />
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-success">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script>
    const scriptURL = "YOUR_WEB_APP_URL"; // <-- replace with your deployed URL

    document.addEventListener("DOMContentLoaded", async function () {
      const calendarEl = document.getElementById("calendar");

      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: "dayGridMonth",
        events: await fetchEvents()
      });

      calendar.render();

      document.getElementById("entryForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const date = document.getElementById("date").value;
        const signer = document.getElementById("signer").value;
        const startTime = document.getElementById("startTime").value;
        const endTime = document.getElementById("endTime").value;

        const hours = computeHours(startTime, endTime);

        await fetch(scriptURL + "?action=add", {
          method: "POST",
          body: JSON.stringify({ date, signer, startTime, endTime, hours }),
        });

        calendar.addEvent({
          title: `${signer} - ${hours} hrs`,
          start: date
        });

        document.getElementById("entryForm").reset();
        bootstrap.Modal.getInstance(document.getElementById("noteModal")).hide();
      });
    });

    function computeHours(start, end) {
      const [h1, m1] = start.split(":").map(Number);
      const [h2, m2] = end.split(":").map(Number);
      return ((h2 + m2 / 60) - (h1 + m1 / 60)).toFixed(2);
    }

    async function fetchEvents() {
      const res = await fetch(scriptURL + "?action=get", { method: "POST" });
      const data = await res.json();

      const events = [];
      for (let i = 1; i < data.length; i++) {
        const [date, signer, start, end, hours] = data[i];
        events.push({ title: `${signer} - ${hours} hrs`, start: date });
      }
      return events;
    }
  </script>
</body>
</html>
