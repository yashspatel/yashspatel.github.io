<!DOCTYPE html>
<html>
<head>
  <title>Push to Google Sheet</title>
  <style>
    body { font-family: Arial; margin: 40px; }
    input { margin: 8px 0; padding: 6px; width: 200px; }
    button { padding: 8px 16px; }
  </style>
</head>
<body>
  <h2>Add Entry2</h2>
  <form id="entryForm">
    <label>Date: <input type="date" id="date" required></label><br>
    <label>Name: <input type="text" id="name" required></label><br>
    <label>Start Time: <input type="time" id="startTime" required></label><br>
    <label>End Time: <input type="time" id="endTime" required></label><br>
    <button type="submit">Submit</button>
  </form>

  <p id="status"></p>

  <script>
    const form = document.getElementById('entryForm');
    const status = document.getElementById('status');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const data = {
        date: document.getElementById('date').value,
        name: document.getElementById('name').value,
        startTime: document.getElementById('startTime').value,
        endTime: document.getElementById('endTime').value,
      };

      fetch('https://script.google.com/macros/s/AKfycbzOXSiEimkeiguciJLwyVuSULAnchC4Og9ukjuiR2KzGoETvcrxCZo91f27LTczroX3/exec', 
        {
        method: 'POST',
        body: JSON.stringify(data),
        headers: {
          'Content-Type': 'application/json',
        }
      })
      .then(res => res.json())
      .then(res => {
        if (res.result === 'success') {
          status.textContent = '✅ Entry added successfully!';
          form.reset();
        } else {
          status.textContent = '❌ Error: ' + res.error;
        }
      })
      .catch(err => {
        console.error(err);
        status.textContent = '❌ Request failed.';
      });
    });
  </script>
</body>
</html>
