<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form and Data Display</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    #data-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    #data-table th, #data-table td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    #floating-btn { position: fixed; bottom: 20px; right: 20px; padding: 10px 20px; background-color: #4285F4; color: white; border: none; border-radius: 50%; font-size: 20px; cursor: pointer; }
    #form-container { display: none; position: fixed; top: 20%; left: 50%; transform: translate(-50%, -20%); background: white; padding: 20px; border: 1px solid #ccc; }
  </style>
</head>
<body>

<h2>Submitted Data</h2>
<table id="data-table">
  <thead>
    <tr><th>Date</th><th>Signer</th><th>Start</th><th>End</th><th>Hours</th></tr>
  </thead>
  <tbody></tbody>
</table>

<button id="floating-btn">+</button>

<div id="form-container">
  <h3>Submit Form</h3>
  <input type="date" id="date"><br>
  <input type="text" id="signer" placeholder="Signer"><br>
  <input type="time" id="start"><br>
  <input type="time" id="end"><br>
  <input type="number" id="hours" placeholder="Hours"><br><br>
  <button onclick="submitForm()">Submit</button>
  <button onclick="closeForm()">Cancel</button>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbypfp6DP7-PEWHTQLVbsMP8VMK6NX-3EQrvykrKDoWD1owSXtICaEhIGanGqKuALKEl/exec";  // Replace with your deployed URL

// Fetch and display data
async function fetchData() {
  const res = await fetch(API_URL + "?getData");
  const data = await res.json();
  const tbody = document.querySelector("#data-table tbody");
  tbody.innerHTML = "";
  data.slice(1).forEach(row => {  // Skip header row
    const tr = document.createElement("tr");
    row.forEach(cell => {
      const td = document.createElement("td");
      td.textContent = cell;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

// Submit form data
async function submitForm() {
  const data = {
    date: document.getElementById("date").value,
    signer: document.getElementById("signer").value,
    start: document.getElementById("start").value,
    end: document.getElementById("end").value,
    hours: document.getElementById("hours").value
  };
  await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });
  closeForm();
  fetchData();  // Refresh table
}

document.getElementById("floating-btn").addEventListener("click", () => {
  document.getElementById("form-container").style.display = "block";
});

function closeForm() {
  document.getElementById("form-container").style.display = "none";
}

// Initialize
fetchData();
</script>

</body>
</html>
