<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calendar App</title>
  <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    #calendar {
      max-width: 1000px;
      margin: 40px auto;
    }
    form {
      display: flex;
      flex-direction: column;
      max-width: 400px;
      margin: auto;
    }
    form input, form button {
      margin: 8px 0;
      padding: 10px;
      font-size: 1em;
    }
  </style>
</head>
<body>
  <h2 style="text-align:center">Work Calendar</h2>

  <form id="event-form">
    <input type="date" id="date" required />
    <input type="text" id="signer" placeholder="Signer Name" required />
    <input type="time" id="startTime" required />
    <input type="time" id="endTime" required />
    <button type="submit">Save Entry</button>
  </form>

  <div id="calendar"></div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxjhbg36EsftGgGm3ve4yyPMalr48pDc26dBQS02na0qorzF9uN6LebniNosLlmnU4/exec'; // Replace with your actual URL

    document.addEventListener('DOMContentLoaded', async function () {
      const calendarEl = document.getElementById('calendar');

      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        height: 'auto',
        selectable: true,
        events: await loadEvents()
      });

      calendar.render();

      document.getElementById('event-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const date = document.getElementById('date').value;
        const signer = document.getElementById('signer').value;
        const startTime = document.getElementById('startTime').value;
        const endTime = document.getElementById('endTime').value;

        const data = { date, signer, startTime, endTime };

        await fetch(scriptURL, {
          method: 'POST',
          body: JSON.stringify(data),
          headers: { 'Content-Type': 'application/json' }
        });

        calendar.removeAllEvents();
        calendar.addEventSource(await loadEvents());
        document.getElementById('event-form').reset();
      });
    });

    async function loadEvents() {
      const res = await fetch(scriptURL);
      return await res.json();
    }

    // Set default date to today
    document.getElementById('date').valueAsDate = new Date();
  </script>
</body>
</html>
