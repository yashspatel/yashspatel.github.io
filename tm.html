<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Work Calendar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #calendar {
      max-width: 100%;
      height: 90vh;
      margin: auto;
    }
    .fc-daygrid-event {
      white-space: normal;
    }
  </style>
</head>
<body>

<div class="container-fluid p-4">
  <h2 class="mb-3 text-center">🗓️ Work Calendar with Signer Notes</h2>
  <div class="d-flex justify-content-end mb-3">
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#noteModal">➕ Add Entry</button>
  </div>
  <div id="calendar"></div>
</div>

<!-- Modal Form -->
<div class="modal fade" id="noteModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="entryForm">
        <div class="modal-header">
          <h5 class="modal-title">Add Work Entry</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <label for="date">Date:</label>
          <input type="date" id="date" class="form-control mb-2" required />

          <label for="signer">Signer Name:</label>
          <input type="text" id="signer" class="form-control mb-2" required />

          <label for="startTime">Start Time:</label>
          <input type="time" id="startTime" class="form-control mb-2" required />

          <label for="endTime">End Time:</label>
          <input type="time" id="endTime" class="form-control mb-2" required />
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success">Save Entry</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<script>
  const scriptURL = "https://script.google.com/macros/s/AKfycbxCJXHdXFHdjg_h3MH1GCWMC8B3fV8RgDLr7qryJu6ttAxZabqoGbBZgKWb6hDRr2qG/exec"; // 🔁 Replace with your Web App URL

  document.addEventListener("DOMContentLoaded", async function () {
    const calendarEl = document.getElementById("calendar");

    const calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: "dayGridMonth",
      height: "100%",
      events: await fetchEvents(),
      eventDisplay: 'block',
      displayEventTime: false,
    });

    calendar.render();

    // Set default date to today
    const today = new Date().toISOString().split('T')[0];
    document.getElementById("date").value = today;

    // Form submit handler
    document.getElementById("entryForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const date = document.getElementById("date").value;
      const signer = document.getElementById("signer").value;
      const startTime = document.getElementById("startTime").value;
      const endTime = document.getElementById("endTime").value;
      const hours = computeHours(startTime, endTime);

      // Save to Google Sheet
      await fetch(scriptURL + "?action=add", {
        method: "POST",
        body: JSON.stringify({ date, signer, startTime, endTime, hours }),
      });

      // Add event to calendar
      calendar.addEvent({
        title: `${signer}\n${startTime} - ${endTime} (${hours} hrs)`,
        start: date
      });

      // Reset and close modal
      e.target.reset();
      document.getElementById("date").value = today;
      bootstrap.Modal.getInstance(document.getElementById("noteModal")).hide();
    });
  });

  function computeHours(start, end) {
    const [h1, m1] = start.split(":").map(Number);
    const [h2, m2] = end.split(":").map(Number);
    const hours = (h2 + m2 / 60) - (h1 + m1 / 60);
    return hours > 0 ? hours.toFixed(2) : "0.00";
  }

  async function fetchEvents() {
    const res = await fetch(scriptURL + "?action=get", { method: "POST" });
    const data = await res.json();
    const events = [];
    for (let i = 1; i < data.length; i++) {
      const [date, signer, start, end, hours] = data[i];
      events.push({
        title: `${signer}\n${start} - ${end} (${hours} hrs)`,
        start: date,
        allDay: true
      });
    }
    return events;
  }
</script>
</body>
</html>
