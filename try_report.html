<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
    <style>
        body {
            background-color: #080808;
            color: #ff3131;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
            background-color: #262626;
        }
        h1, h2, h3, h4, h5, h6 {
            color: #ff3131;
        }
        p {
            color: #ff3131;
        }
        .slider {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            height: auto;
            position: relative;
        }
        .slider img {
            width: 100%;
            height: auto;
            display: none;
        }
        .slider img.active {
            display: block;
        }
        .slider-indicator {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px 0;
        }
        .slider-indicator button {
            border: none;
            background-color: #ff3131;
            border-radius: 50%;
            width: 10px;
            height: 10px;
        }
        .slider-indicator button.active {
            background-color: #080808;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Your content here -->

        <div class="slider">
            <img src="images/work/weedDetection/1.jpeg" class="active" alt="Image 1">
            <img src="images/work/weedDetection/2.jpeg" alt="Image 2">
            <!-- Add more images as needed -->
            <div class="slider-indicator">
                <!-- Buttons will be inserted here by JavaScript -->
            </div>
        </div>

        <!-- More of your content here -->
    </div>

    <script>
        var sliderImages = Array.from(document.querySelectorAll(".slider img"));
        var currentIndex = 0;

        function showImage(index) {
            sliderImages.forEach(function(img, i) {
                img.classList.toggle("active", i === index);
            });
            Array.from(document.querySelectorAll(".slider-indicator button")).forEach(function(btn, i) {
                btn.classList.toggle("active", i === index);
            });
        }

        // Insert indicator buttons
        var indicator = document.querySelector(".slider-indicator");
        sliderImages.forEach(function(img, index) {
            var btn = document.createElement("button");
            btn.addEventListener("click", function() {
                currentIndex = index;
                showImage(currentIndex);
            });
            indicator.appendChild(btn);
        });

        showImage(currentIndex);  // Show the first image
    </script>
</body>
</html>
